<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #f7f7f8; --card: #fff; --fg: #18181b; --muted: #71717a;
    --line: #e4e4e7; --accent: #2563eb; --accent-fg: #fff;
    --ok-bg: #ecfdf5; --ok-fg: #047857; --ok-line: #a7f3d0;
    --ai-bg: #eff6ff; --ai-fg: #1d4ed8; --ai-line: #bfdbfe;
    --warn-bg: #fffbeb; --warn-fg: #92400e; --warn-line: #fde68a;
    --err-bg: #fef2f2; --err-fg: #b91c1c; --err-line: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0b0d; --card: #151518; --fg: #fafafa; --muted: #a1a1aa;
      --line: #27272a; --accent: #3b82f6;
      --ok-bg: #052e1f; --ok-fg: #6ee7b7; --ok-line: #065f46;
      --ai-bg: #0c1e3d; --ai-fg: #93c5fd; --ai-line: #1e40af;
      --warn-bg: #2b1f05; --warn-fg: #fcd34d; --warn-line: #78350f;
      --err-bg: #2b0d0d; --err-fg: #fca5a5; --err-line: #7f1d1d;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 360px; margin: 0; padding: 14px; background: var(--bg); color: var(--fg);
    font: 13px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .brand { font-weight: 600; font-size: 14px; }
  .dot { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); }
  .dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.up i { background: #10b981; }
  .dot.down i { background: #ef4444; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .row:first-child { margin-top: 0; }

  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.plat { border-color: var(--accent); color: var(--accent); }
  .badge.subtitle { background: var(--ok-bg); color: var(--ok-fg); border-color: var(--ok-line); }
  .badge.asr { background: var(--ai-bg); color: var(--ai-fg); border-color: var(--ai-line); }

  .ptitle {
    font-size: 13px; font-weight: 500; margin: 2px 0 0; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .muted { color: var(--muted); font-size: 12px; }

  select {
    flex: 1; padding: 5px 7px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: var(--fg); font: inherit; font-size: 12px; outline: none;
  }
  button {
    padding: 8px 14px; border: none; border-radius: 8px; background: var(--accent);
    color: var(--accent-fg); font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { opacity: .88; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--fg); border: 1px solid var(--line);
    font-weight: 400; font-size: 12px; padding: 6px 10px;
  }
  button.ghost:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

  .banner { padding: 10px 12px; border-radius: 9px; font-size: 12.5px; margin-bottom: 10px; line-height: 1.5; }
  .banner.warn { background: var(--warn-bg); color: var(--warn-fg); border: 1px solid var(--warn-line); }
  .banner.err { background: var(--err-bg); color: var(--err-fg); border: 1px solid var(--err-line); }
  .banner code { background: rgba(128,128,128,.2); padding: 1px 4px; border-radius: 3px; }

  #progress { display: none; }
  #progress.show { display: block; }
  .stage { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .spin {
    width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .logs {
    margin-top: 7px; font-size: 11.5px; color: var(--muted); max-height: 84px; overflow-y: auto;
    font-family: ui-monospace, Menlo, monospace; padding-left: 21px;
  }

  #result { display: none; }
  #result.show { display: block; }
  pre.text {
    margin: 8px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--line);
    border-radius: 8px; max-height: 150px; overflow-y: auto; font: inherit; font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  .downloads { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
</style>
</head>
<body>
  <div class="head">
    <span class="brand">OpenVideo2Text</span>
    <span class="dot" id="status"><i></i><span id="status-text">检查服务…</span></span>
  </div>

  <div id="banner"></div>

  <div class="card" id="page-card">
    <div class="row">
      <span class="badge plat" id="platform">识别中…</span>
    </div>
    <div class="ptitle" id="page-title">读取页面信息…</div>
    <div class="muted" id="page-hint"></div>

    <div class="row">
      <select id="language">
        <option value="zh" selected>中文</option>
        <option value="en">English</option>
        <option value="">自动检测</option>
      </select>
      <select id="engine"></select>
      <button id="go">提取文字</button>
    </div>
  </div>

  <div class="card" id="progress" style="margin-top:10px">
    <div class="stage"><div class="spin"></div><span id="stage">准备中…</span></div>
    <div class="logs" id="logs"></div>
  </div>

  <div class="card" id="result" style="margin-top:10px">
    <div class="row" style="margin-top:0">
      <span class="badge" id="r-source"></span>
      <span class="muted" id="r-meta"></span>
    </div>
    <pre class="text" id="r-text"></pre>
    <div class="downloads" id="r-downloads"></div>
  </div>

  <script src="extract.js"></script>
  <script src="popup.js"></script>
</body>
</html>
